name: Android Project Doctor Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check main source syntax
        run: node --check src/index.js

      - name: Check compatibility source syntax
        run: node --check src/compatibility.js

      - name: Run automated tests
        run: npm test
